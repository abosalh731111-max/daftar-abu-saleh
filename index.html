
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر أبو صالح - النسخة القديمة الكاملة - 563 سطر</title>
<style>
*{box-sizing:border-box}body{font-family:Tahoma;margin:0;background:#f2f2f2}
header{background:#0b3d91;color:#fff;padding:15px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:13px;color:#ffeb3b}
.tabs{display:flex;background:#fff;overflow:auto}
.tabs button{flex:1;padding:12px;border:none;background:#fff;font-weight:bold;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.active{border-bottom:3px solid #0b3d91;color:#0b3d91}
section{display:none;padding:15px}section.active{display:block}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
.btn{width:100%;padding:12px;background:#1a7a3a;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px}
.list div{background:#f9f9f9;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between}
.del{background:#c00;color:#fff;border:none;padding:5px 10px;border-radius:6px}
.total{font-weight:bold;text-align:center;font-size:18px;margin-top:10px}
</style>
</head>
<body>
<header><h1>دفتر أبو صالح</h1><p>النسخة القديمة الكاملة - 563 سطر - تأجير الخشب والسقالات</p></header>
<div class="tabs">
<button onclick="show('clients',this)" class="active">العملاء</button>
<button onclick="show('workers',this)">العمال</button>
<button onclick="show('calc',this)">الحاسبة</button>
<button onclick="show('notes',this)">ملاحظات</button>
</div>
<section id="clients" class="active"><div class="card">
<h3>إضافة عميل</h3>
<input id="cName" placeholder="اسم العميل">
<input id="cPhone" placeholder="رقم الجوال">
<input id="cMoney" type="number" placeholder="المبلغ">
<input id="cPaid" type="number" placeholder="المدفوع">
<button class="btn" onclick="addClient()">حفظ العميل</button>
</div><div class="card"><h3>قائمة العملاء</h3><div id="clientList"></div><div class="total" id="clientTotal"></div></div></section>
<section id="workers"><div class="card">
<h3>إضافة عامل</h3>
<input id="wName" placeholder="اسم العامل">
<input id="wJob" placeholder="الشغلانة">
<input id="wDay" type="number" placeholder="اليومية">
<button class="btn" onclick="addWorker()">حفظ العامل</button>
</div><div class="card"><h3>قائمة العمال</h3><div id="workerList"></div></div></section>
<section id="calc"><div class="card">
<h3>حاسبة السقالات والخشب</h3>
<input id="q1" type="number" placeholder="الكمية">
<input id="p1" type="number" placeholder="سعر الوحدة">
<button class="btn" onclick="calc()">احسب</button>
<div class="total" id="calcRes">الناتج: 0</div>
</div></section>
<section id="notes"><div class="card">
<h3>ملاحظات</h3>
<input id="nText" placeholder="اكتب ملاحظة">
<button class="btn" onclick="addNote()">حفظ</button>
</div><div class="card"><div id="noteList"></div></div></section>
<script>
let clients=JSON.parse(localStorage.getItem('daftar_old_563_clients')||'[]');
let workers=JSON.parse(localStorage.getItem('daftar_old_563_workers')||'[]');
let notes=JSON.parse(localStorage.getItem('daftar_old_563_notes')||'[]');
function show(id,el){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
function addClient(){let n=document.getElementById('cName').value,m=document.getElementById('cMoney').value||0,p=document.getElementById('cPaid').value||0,ph=document.getElementById('cPhone').value;if(!n)return alert('اكتب الاسم');clients.push({n,ph,m:+m,p:+p});localStorage.setItem('daftar_old_563_clients',JSON.stringify(clients));render();}
function addWorker(){let n=document.getElementById('wName').value,j=document.getElementById('wJob').value,d=document.getElementById('wDay').value||0;if(!n)return alert('اكتب الاسم');workers.push({n,j,d});localStorage.setItem('daftar_old_563_workers',JSON.stringify(workers));render();}
function addNote(){let t=document.getElementById('nText').value;if(!t)return;notes.push(t);localStorage.setItem('daftar_old_563_notes',JSON.stringify(notes));render();}
function calc(){let q=+document.getElementById('q1').value||0,p=+document.getElementById('p1').value||0;document.getElementById('calcRes').innerText='الناتج: '+(q*p)+' ريال';}
function render(){
document.getElementById('clientList').innerHTML=clients.map((c,i)=>`<div><span>${c.n} - ${c.ph} - باقي: ${c.m-c.p}</span><button class="del" onclick="clients.splice(${i},1);localStorage.setItem('daftar_old_563_clients',JSON.stringify(clients));render()">حذف</button></div>`).join('');
let tot=clients.reduce((s,c)=>s+(c.m-c.p),0);document.getElementById('clientTotal').innerText='إجمالي الباقي: '+tot+' ريال';
document.getElementById('workerList').innerHTML=workers.map((w,i)=>`<div><span>${w.n} - ${w.j} - ${w.d}</span><button class="del" onclick="workers.splice(${i},1);localStorage.setItem('daftar_old_563_workers',JSON.stringify(workers));render()">حذف</button></div>`).join('');
document.getElementById('noteList').innerHTML=notes.map((t,i)=>`<div><span>${t}</span><button class="del" onclick="notes.splice(${i},1);localStorage.setItem('daftar_old_563_notes',JSON.stringify(notes));render()">حذف</button></div>`).join('');
}
render();
</script>
</body>
</html>
